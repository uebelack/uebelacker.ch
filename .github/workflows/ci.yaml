name: "Continuous Integration"
on:
  pull_request:
    branches: '*'
  # Also on pushes to main. The required "Test and Lint" check could never
  # report on a direct push without this, so a commit that reached main
  # outside a PR carried no check result at all — which is how a broken
  # reCAPTCHA provider shipped with a green-looking history.
  #
  # This reports a result, it does not gate: status checks block merges, not
  # pushes. The gate is still the pull request.
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # --frozen-lockfile so CI fails on a lockfile that does not match
      # package.json, rather than quietly resolving something else.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint code
        run: pnpm lint
      # `pnpm test` runs the package.json script, which is jest. The previous
      # `bun test` ran Bun's own test runner instead of the script, so the jest
      # suite was never actually executed here.
      - name: Run Tests
        run: pnpm test
      # Lint and tests both passed while the build was broken during the pnpm
      # migration — a duplicate-React resolution only `next build` caught. The
      # build is the step that actually proves the site ships.
      - name: Build
        run: pnpm build
