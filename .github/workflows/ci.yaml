name: "Continuous Integration"
on:
  pull_request:
    branches: '*'

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # --frozen-lockfile so CI fails on a lockfile that does not match
      # package.json, rather than quietly resolving something else.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint code
        run: pnpm lint
      # `pnpm test` runs the package.json script, which is jest. The previous
      # `bun test` ran Bun's own test runner instead of the script, so the jest
      # suite was never actually executed here.
      - name: Run Tests
        run: pnpm test
